- name: Firewall management
  community.general.ufw:
    state: enabled
- name: Allow Port 22
  community.general.ufw:
    rule: allow
    port: 22
- name: Allow Port 80
  community.general.ufw:
    rule: allow
    port: 80
- name: Allow Port 443
  community.general.ufw:
    rule: allow
    port: 443