- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    state: directory
    path: /etc/apt/keyrings
    mode: '0755'
- name: Set ansible_architecture
  ansible.builtin.set_fact:
    docker_arch: "{{ arch_map[ansible_facts['architecture']] if ansible_facts['architecture'] == 'aarch64' or ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture']}}"
- name: Add Docker's Official GPG Key and Add the Docker Repository
  block:
    - name: Add Docker's Official GPG Key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: a+r
    - name: Add the Docker Repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli 
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin 
- name: Add user to docker group
  ansible.builtin.user:
    name: vagrant
    append: true
    groups: docker