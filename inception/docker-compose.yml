services:
  mariadb:
    image: mariadb:ia
    build: ./services/mariadb
    container_name: mariadb
    restart: always
    environment: 
      - USERNAME=$MARIADB_USERNAME
      - PASSWORD=$MARIADB_PASSWORD
      - DB=$MARIADB_DB
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception-network
    configs:
      - source: mariadb_config
        target: /etc/mysql/mariadb.conf.d/mariadb.cnf
    healthcheck:
      test: ["CMD", "mariadb-admin", "-uroot", "ping"]
      interval: 10s
      retries: 2

  nginx:
    image: nginx:ia
    build:
      context: ./services/nginx
    ports:
      - "443:443"
      - "80:80"
    container_name: nginx
    restart: always
    environment:
      - DOMAIN_NAME=$DOMAIN_NAME
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/html
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - inception-network

  wordpress:
    image: wordpress:ia
    build: ./services/wordpress
    container_name: wordpress
    restart: always
    environment:
      - TITLE=$WP_TITLE
      - USER_NAME=$WP_USER_NAME
      - USER_EMAIL=$WP_USER_EMAIL
      - USER_ROLE=$WP_USER_ROLE
      - USER_PASS=$WP_USER_PASS
      - ADMIN_NAME=$WP_ADMIN_NAME
      - ADMIN_PASS=$WP_ADMIN_PASS
      - ADMIN_EMAIL=$WP_ADMIN_EMAIL
      - DB=$MARIADB_DB
      - USERNAME=$MARIADB_USERNAME
      - PASSWORD=$MARIADB_PASSWORD
      - HOST=$MARIADB_HOST
      - DOMAIN_NAME=$DOMAIN_NAME
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "ps aux | grep 'php-fpm: master process'"]
      interval: 10s
      retries: 2
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    networks:
      - inception-network
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: ${MARIADB_HOST:-mariadb}
      PMA_USER: ${MARIADB_USERNAME}
      PMA_PASSWORD: ${MARIADB_PASSWORD}
      UPLOAD_LIMIT: 200M
    depends_on:
      mariadb:
        condition: service_healthy

configs:
  nginx_config:
    file: ./services/nginx/conf/nginx.conf
  mariadb_config:
    file: ./services/mariadb/conf/mariadb.cnf

volumes:
  mariadb_data:
    name: mariadb
    driver: local
    driver_opts:
      device: /root/inception/data/mariadb/
      o: bind
      type: none
  wordpress_data:
    name: wordpress
    driver: local
    driver_opts:
      device: /root/inception/data/wordpress/
      o: bind
      type: none

networks:
  inception-network:
    name: inception-network